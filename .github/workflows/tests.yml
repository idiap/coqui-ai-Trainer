name: tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        uv-resolution: ["highest"]
        include:
          - python-version: "3.10"
            uv-resolution: "lowest-direct"
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: ./.github/actions/setup-uv
      - name: Unit tests
        run: >
          uv run --resolution=${{ matrix.uv-resolution }}
          --all-extras --no-extra cuda --group test coverage run --parallel
      - name: Upload coverage data
        uses: actions/upload-artifact@v5
        with:
          include-hidden-files: true
          name: coverage-data-${{ matrix.python-version }}-${{ matrix.uv-resolution }}
          path: .coverage.*
          if-no-files-found: ignore
  test-macos:
    # Hosted Apple Silicon runners expose a Metal device, so this covers MPS on
    # real hardware. Single Python version: the matrix above covers versions.
    runs-on: macos-15
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: ./.github/actions/setup-uv
      - name: Install
        run: uv sync --all-extras --no-extra cuda --group test
      - name: Check for a Metal device
        # Fail loudly rather than let the MPS tests skip themselves into a green
        # run if a future runner image stops passing the GPU through.
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import sys

          import torch

          available = torch.backends.mps.is_available()
          rows = [
              "| check | value |",
              "| --- | --- |",
              f"| torch | `{torch.__version__}` |",
              f"| mps.is_built() | `{torch.backends.mps.is_built()}` |",
              f"| mps.is_available() | `{available}` |",
              f"| autocast available | `{torch.amp.is_autocast_available('mps')}` |",
          ]
          if not available:
              rows.append("")
              rows.append("No Metal device: the MPS tests would skip instead of running.")
          summary = "\n".join(rows)
          print(summary)
          if path := os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(path, "a") as f:
                  f.write(summary + "\n")
          sys.exit(0 if available else 1)
          PY
      - name: Unit tests
        run: uv run --no-sync pytest tests -q
  coverage:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: ./.github/actions/setup-uv
      - uses: actions/download-artifact@v6
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine coverage
        run: |
          uv python install
          uvx coverage combine
          uvx coverage html --skip-covered --skip-empty
          uvx coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
